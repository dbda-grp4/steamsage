name: Deploy & Run Glue ETL Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      BUCKET_NAME: steam-analytics-steam-analytics-aman-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338149548627:role/steam-analytics-github-actions-role-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Glue scripts to S3
        run: |
          aws s3 sync glue/ s3://${BUCKET_NAME}/glue-scripts/ --delete

      # ---------------- APPLICATIONS JOB ----------------
      - name: Run applications job
        id: applications
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-applications-job-dev \
            --query JobRunId --output text)

          echo "APPLICATIONS_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for applications job
        run: |
          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-applications-job-dev \
              --run-id $APPLICATIONS_RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Applications status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

      # ---------------- REVIEWS JOB ----------------
      - name: Run reviews job
        id: reviews
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-reviews-job-dev \
            --query JobRunId --output text)

          echo "REVIEWS_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for reviews job
        run: |
          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-reviews-job-dev \
              --run-id $REVIEWS_RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Reviews status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

      # ---------------- DIMENSIONS JOB ----------------
      - name: Run dimensions job
        id: dimensions
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-dimensions-job-dev \
            --query JobRunId --output text)

          echo "DIMENSIONS_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for dimensions job
        run: |
          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-dimensions-job-dev \
              --run-id $DIMENSIONS_RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Dimensions status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

      # ---------------- MASTER JOB ----------------
      - name: Run master job
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-master-job-dev \
            --query JobRunId --output text)

          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-master-job-dev \
              --run-id $RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Master status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

name: Deploy & Run Glue ETL Pipeline

on:
  push:
    branches: [ "main" ]
    paths: [ "glue/**", "infra/**" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # --------------------------------------------------
  # PHASE 1: Terraform (Builds & Outputs Config)
  # --------------------------------------------------
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    
    # Expose outputs to other jobs
    outputs:
      bucket_name: ${{ steps.tf_out.outputs.bucket_name }}
      role_arn:    ${{ steps.tf_out.outputs.role_arn }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ---------------------------------------------------------
      # 🛠️ THIS IS THE MISSING STEP!
      # ---------------------------------------------------------
      - name: Create State Bucket if Missing
        id: create-state
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="steam-analytics-state-${ACCOUNT_ID}"
          echo "BUCKET_NAME=${STATE_BUCKET}" >> $GITHUB_ENV
          
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Bucket exists."
          else
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
          fi

      - uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------------
      # 🔌 THIS IS THE UPDATED INIT COMMAND
      # ---------------------------------------------------------
      - name: Terraform Init
        env:
          STATE_BUCKET: ${{ env.BUCKET_NAME }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=us-east-1"
      
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="github_repo=${{ github.repository }}" \
            -var="data_bucket_name=placeholder" 

      - name: Export Outputs
        id: tf_out
        run: |
          echo "bucket_name=$(terraform output -raw DEPLOY_BUCKET_NAME)" >> $GITHUB_OUTPUT
          echo "role_arn=$(terraform output -raw DEPLOY_ROLE_ARN)" >> $GITHUB_OUTPUT

  # --------------------------------------------------
  # PHASE 2: Deploy Scripts
  # --------------------------------------------------
  deploy:
    name: Run Glue Jobs
    runs-on: ubuntu-latest
    needs: terraform
    
    env:
      AWS_REGION: us-east-1
      BUCKET_NAME: ${{ needs.terraform.outputs.bucket_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.terraform.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Glue scripts
        run: aws s3 sync glue/ s3://${BUCKET_NAME}/glue-scripts/ --delete
        
      # ---------------- APPLICATIONS JOB ----------------
      - name: Run applications job
        id: applications
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-applications-job-dev \
            --query JobRunId --output text)

          echo "APPLICATIONS_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for applications job
        run: |
          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-applications-job-dev \
              --run-id $APPLICATIONS_RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Applications status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

      # ---------------- REVIEWS JOB ----------------
      - name: Run reviews job
        id: reviews
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-reviews-job-dev \
            --query JobRunId --output text)

          echo "REVIEWS_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for reviews job
        run: |
          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-reviews-job-dev \
              --run-id $REVIEWS_RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Reviews status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

      # ---------------- DIMENSIONS JOB ----------------
      - name: Run dimensions job
        id: dimensions
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-dimensions-job-dev \
            --query JobRunId --output text)

          echo "DIMENSIONS_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Wait for dimensions job
        run: |
          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-dimensions-job-dev \
              --run-id $DIMENSIONS_RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Dimensions status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

      # ---------------- MASTER JOB ----------------
      - name: Run master job
        run: |
          RUN_ID=$(aws glue start-job-run \
            --job-name steam-analytics-master-job-dev \
            --query JobRunId --output text)

          while true; do
            STATUS=$(aws glue get-job-run \
              --job-name steam-analytics-master-job-dev \
              --run-id $RUN_ID \
              --query JobRun.JobRunState --output text)

            echo "Master status: $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              break
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then
              exit 1
            fi

            sleep 30
          done

# ---------------- GOLD CRAWLER (ADDED) ----------------
      - name: Run Gold Crawler
        run: |
          echo "Starting Gold Crawler..."
          aws glue start-crawler --name steam-analytics-gold-crawler-dev

          # Give it a moment to shift to RUNNING state
          sleep 10

          while true; do
            STATUS=$(aws glue get-crawler \
              --name steam-analytics-gold-crawler-dev \
              --query Crawler.State --output text)

            echo "Crawler status: $STATUS"

            # Crawlers go from READY -> RUNNING -> STOPPING -> READY
            # We wait until it returns to READY
            if [ "$STATUS" = "READY" ]; then
              echo "Crawler finished successfully!"
              break
            fi

            sleep 30
          done

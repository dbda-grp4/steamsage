name: Steam Glue Pipeline (Full Automation)

on:
  push:
    branches:
      - main

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 3️⃣ Upload Glue scripts to S3
    - name: Upload Glue scripts
      run: |
        aws s3 sync glue-scripts/ s3://steam-glue-roshani-2026/glue-scripts/

    # 4️⃣ Terraform Init
    - name: Terraform Init
      working-directory: infra
      run: terraform init

    # 5️⃣ Terraform Apply (infra, jobs, workflow, alarms)
    - name: Terraform Apply
      working-directory: infra
      run: terraform apply -auto-approve

    # 6️⃣ Trigger Glue Workflow (FULL ETL)
    - name: Trigger Glue Workflow
      run: |
        aws glue start-workflow-run \
          --name steam-etl-workflow

    # 7️⃣ Run Glue Crawlers (Athena automation)
    - name: Run Glue Crawlers
      run: |
        aws glue start-crawler --name steam-curated-crawler
        aws glue start-crawler --name steam-gold-crawler

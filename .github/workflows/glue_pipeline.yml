name: Steam Glue Pipeline (CI + CD + Sequential ETL)

on:
  push:
    branches:
      - main

jobs:
  full-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 3️⃣ Upload Glue scripts to S3 (CI)
    - name: Upload Glue scripts to S3
      run: |
        aws s3 sync glue_scripts/ s3://steam-glue-roshani-2026/glue-scripts/

    # 4️⃣ Terraform Init
    - name: Terraform Init
      working-directory: infra
      run: terraform init

    # 5️⃣ Terraform Apply (Infra + Glue Jobs + Workflow)
    - name: Terraform Apply
      working-directory: infra
      run: terraform apply -auto-approve

    # 6️⃣ Run Applications ETL (Sequential)
    - name: Run Applications ETL
      run: |
        aws glue start-job-run --job-name tf-steam-applications-etl

    # 7️⃣ Run Reviews ETL
    - name: Run Reviews ETL
      run: |
        aws glue start-job-run --job-name tf-steam-reviews-etl

    # 8️⃣ Run Dimensions ETL
    - name: Run Dimensions ETL
      run: |
        aws glue start-job-run --job-name tf-steam-dimensions-etl

    # 9️⃣ Run Masterdata ETL
    - name: Run Masterdata ETL
      run: |
        aws glue start-job-run --job-name tf-steam-masterdata-etl

    # 🔟 Run Crawlers (Athena Automation)
    - name: Run Glue Crawlers
      run: |
        aws glue start-crawler --name steam-curated-crawler
        aws glue start-crawler --name steam-gold-crawler

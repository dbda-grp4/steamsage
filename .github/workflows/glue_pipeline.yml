name: Steam Glue Pipeline (CI + CD + Orchestration)

on:
  push:
    branches:
      - Roshani

  workflow_dispatch:

jobs:
  deploy-and-run:
    name: Deploy Infra, Upload Scripts, Run Glue Workflow
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1️⃣ Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2️⃣ Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --------------------------------------------------
      # 3️⃣ Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------
      # 4️⃣ Upload Glue scripts to S3 (CI)
      # --------------------------------------------------
      - name: Upload Glue scripts to S3
        run: |
          aws s3 sync glue_scripts/ s3://steam-glue-roshani-2026/glue-scripts/

      # --------------------------------------------------
      # 5️⃣ Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        working-directory: infra
        run: terraform init

      # --------------------------------------------------
      # 6️⃣ Terraform Apply (Infra as Code)
      # --------------------------------------------------
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      # --------------------------------------------------
      # 7️⃣ Start Glue Workflow (Single Orchestration Trigger)
      # --------------------------------------------------
      - name: Start Glue ETL Workflow
        run: |
          aws glue start-workflow-run \
            --name tf-steam-etl-workflow

name: Steam CI + CD + Automated ETL Pipeline

on:
  push:
    branches:
      - main

jobs:
  steam-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # 3️⃣ Upload Glue scripts to S3 (CI step)
    - name: Upload Glue scripts to S3
      run: |
        aws s3 sync glue_scripts/ s3://steam-glue-roshani-2026/glue-scripts/

    # 4️⃣ Terraform Init
    - name: Terraform Init
      working-directory: infra
      run: terraform init

    # 5️⃣ Terraform Apply (infra + glue jobs)
    - name: Terraform Apply
      working-directory: infra
      run: terraform apply -auto-approve

    # =========================
    # ETL JOBS (SEQUENTIAL RUN)
    # =========================

    - name: Run Applications ETL
      run: aws glue start-job-run --job-name steam-applications-etl

    - name: Run Reviews ETL
      run: aws glue start-job-run --job-name steam-reviews-etl

    - name: Run Dimensions ETL
      run: aws glue start-job-run --job-name steam-dimensions-etl

    - name: Run Masterdata ETL
      run: aws glue start-job-run --job-name steam-masterdata-etl

    # =========================
    # CRAWLERS (SCHEMA UPDATE)
    # =========================

    - name: Run Curated Crawler
      run: aws glue start-crawler --name steam-curated-crawler

    - name: Run Gold Crawler
      run: aws glue start-crawler --name steam-gold-crawler

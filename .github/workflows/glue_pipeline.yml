name: Steam Terraform + ETL Automation (CI + CD)

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1

  # S3
  GLUE_SCRIPTS_BUCKET: steam-glue-roshani-2026
  GLUE_SCRIPTS_PREFIX: glue-scripts

  # Glue Jobs
  APP_JOB: tf-steam-applications-etl
  REVIEWS_JOB: tf-steam-reviews-etl
  DIM_JOB: tf-steam-dimensions-etl
  MASTER_JOB: tf-steam-masterdata-etl

  # Crawlers
  CURATED_CRAWLER: steam-curated-crawler
  GOLD_CRAWLER: steam-gold-crawler

  # Athena
  ATHENA_DB: steam_gold_db
  ATHENA_OUTPUT: s3://steam-glue-roshani-2026/athena-results/

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2️⃣ AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 3️⃣ Upload Glue Scripts (CI)
    - name: Upload Glue Scripts to S3
      run: |
        aws s3 sync glue_scripts/ s3://${GLUE_SCRIPTS_BUCKET}/${GLUE_SCRIPTS_PREFIX}/

    # 4️⃣ Terraform Init
    - name: Terraform Init
      working-directory: infra
      run: terraform init

    # 5️⃣ Terraform Apply
    - name: Terraform Apply
      working-directory: infra
      run: terraform apply -auto-approve

    # -------------------------
    # ETL JOBS (SEQUENTIAL + WAIT)
    # -------------------------

    - name: Run Applications ETL
      run: |
        JOB_ID=$(aws glue start-job-run --job-name $APP_JOB --query JobRunId --output text)
        echo "Applications JobRunId: $JOB_ID"
        while true; do
          STATUS=$(aws glue get-job-run --job-name $APP_JOB --run-id $JOB_ID --query JobRun.JobRunState --output text)
          echo "Applications status: $STATUS"
          if [ "$STATUS" == "SUCCEEDED" ]; then break; fi
          if [ "$STATUS" == "FAILED" ] || [ "$STATUS" == "STOPPED" ]; then exit 1; fi
          sleep 30
        done

    - name: Run Reviews ETL
      run: |
        JOB_ID=$(aws glue start-job-run --job-name $REVIEWS_JOB --query JobRunId --output text)
        echo "Reviews JobRunId: $JOB_ID"
        while true; do
          STATUS=$(aws glue get-job-run --job-name $REVIEWS_JOB --run-id $JOB_ID --query JobRun.JobRunState --output text)
          echo "Reviews status: $STATUS"
          if [ "$STATUS" == "SUCCEEDED" ]; then break; fi
          if [ "$STATUS" == "FAILED" ] || [ "$STATUS" == "STOPPED" ]; then exit 1; fi
          sleep 30
        done

    - name: Run Dimensions ETL
      run: |
        JOB_ID=$(aws glue start-job-run --job-name $DIM_JOB --query JobRunId --output text)
        echo "Dimensions JobRunId: $JOB_ID"
        while true; do
          STATUS=$(aws glue get-job-run --job-name $DIM_JOB --run-id $JOB_ID --query JobRun.JobRunState --output text)
          echo "Dimensions status: $STATUS"
          if [ "$STATUS" == "SUCCEEDED" ]; then break; fi
          if [ "$STATUS" == "FAILED" ] || [ "$STATUS" == "STOPPED" ]; then exit 1; fi
          sleep 30
        done

    - name: Run Masterdata ETL
      run: |
        JOB_ID=$(aws glue start-job-run --job-name $MASTER_JOB --query JobRunId --output text)
        echo "Masterdata JobRunId: $JOB_ID"
        while true; do
          STATUS=$(aws glue get-job-run --job-name $MASTER_JOB --run-id $JOB_ID --query JobRun.JobRunState --output text)
          echo "Masterdata status: $STATUS"
          if [ "$STATUS" == "SUCCEEDED" ]; then break; fi
          if [ "$STATUS" == "FAILED" ] || [ "$STATUS" == "STOPPED" ]; then exit 1; fi
          sleep 30
        done

    # -------------------------
    # Crawlers
    # -------------------------

    - name: Run Curated Crawler
      run: aws glue start-crawler --name $CURATED_CRAWLER

    - name: Run Gold Crawler
      run: aws glue start-crawler --name $GOLD_CRAWLER

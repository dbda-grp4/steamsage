name: Steam Glue Pipeline (Safe CI/CD)

on:
  push:
    branches:
      - Roshani
    paths:
      - glue_scripts/**
      - infra/**
  workflow_dispatch:
  
jobs:
  deploy-and-run:
    name: Deploy Infra, Upload Scripts, Trigger Glue Workflow
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1️⃣ Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2️⃣ Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --------------------------------------------------
      # 3️⃣ Setup Terraform (explicit & safe)
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # --------------------------------------------------
      # 4️⃣ Upload Glue scripts (CI responsibility)
      # --------------------------------------------------
      - name: Upload Glue scripts to S3
        run: |
          aws s3 sync glue_scripts/ s3://steam-glue-roshani-2026/glue-scripts/ --delete

      # --------------------------------------------------
      # 5️⃣ Terraform Init (idempotent)
      # --------------------------------------------------
      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      # --------------------------------------------------
      # 6️⃣ Terraform Validate (early failure protection)
      # --------------------------------------------------
      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      # --------------------------------------------------
      # 7️⃣ Terraform Plan (read-only safety check)
      # --------------------------------------------------
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      # --------------------------------------------------
      # 8️⃣ Terraform Apply (only planned changes)
      # --------------------------------------------------
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

      # --------------------------------------------------
      # 9️⃣ Trigger Glue Workflow (single execution entry)
      # --------------------------------------------------
      - name: Start Glue ETL Workflow
        run: |
          aws glue start-workflow-run \
            --name steam-etl-workflow
